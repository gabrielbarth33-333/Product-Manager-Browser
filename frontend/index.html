<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Produtos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Produtos</h1>
            <button id="btn-new-product" class="btn btn-primary">Novo Produto</button>
        </header>

        <div id="loading" class="loading hidden">Carregando...</div>
        <div id="error" class="error hidden"></div>
        <div id="success" class="success hidden"></div>

        <table id="products-table" class="table">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>EAN</th>
                    <th>Preço</th>
                    <th>Preço Promocional</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="products-body">
            </tbody>
        </table>

        <div id="empty-state" class="empty-state hidden">
            Nenhum produto cadastrado.
        </div>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Novo Produto</h2>
                <button id="btn-close-modal" class="btn-close">&times;</button>
            </div>
            <form id="product-form">
                <div class="form-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" required maxlength="250">
                </div>
                <div class="form-group">
                    <label for="code">Código</label>
                    <input type="text" id="code" name="code" required maxlength="50">
                </div>
                <div class="form-group">
                    <label for="ean">EAN</label>
                    <input type="text" id="ean" name="ean" maxlength="20">
                </div>
                <div class="form-group">
                    <label for="price">Preço</label>
                    <input type="number" id="price" name="price" required min="0.01" step="0.01">
                </div>
                <div class="form-group">
                    <label for="promotionalPrice">Preço Promocional</label>
                    <input type="number" id="promotionalPrice" name="promotionalPrice" required min="0" step="0.01">
                </div>
                <div class="modal-footer">
                    <button type="button" id="btn-cancel" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
